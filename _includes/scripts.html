<script>
    (function () {
        var openBtn     = document.getElementById('openNav');
        var closeBtn    = document.getElementById('closeNav');
        var mobileNav   = document.getElementById('mobileNav');
        var navBackdrop = document.getElementById('mobileNavBackdrop');

        function openMobileNav() {
            mobileNav.inert = false;
            mobileNav.classList.add('open');
            navBackdrop.classList.add('open');
            document.body.style.overflow = 'hidden';
            openBtn.setAttribute('aria-expanded', 'true');
            if (closeBtn) closeBtn.focus();
        }
        function closeMobileNav() {
            if (mobileNav.contains(document.activeElement)) openBtn.focus();
            mobileNav.inert = true;
            mobileNav.classList.remove('open');
            navBackdrop.classList.remove('open');
            document.body.style.overflow = '';
            openBtn.setAttribute('aria-expanded', 'false');
        }
        window.closeMobileNav = closeMobileNav;

        if (openBtn && mobileNav && navBackdrop) {
            openBtn.addEventListener('click', openMobileNav);
            if (closeBtn) closeBtn.addEventListener('click', closeMobileNav);
            navBackdrop.addEventListener('click', closeMobileNav);
            // Following any link inside the drawer should also dismiss it. The old
            // per-link onclick="closeMobileNav()" attributes did this on the
            // homepage only; delegating covers every page.
            mobileNav.addEventListener('click', function (e) {
                if (e.target.closest('a')) closeMobileNav();
            });
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') closeMobileNav();
            });
        }

        document.querySelectorAll('.faq-question').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var item = this.closest('.faq-item');
                var isOpen = item.classList.contains('open');
                document.querySelectorAll('.faq-item.open').forEach(function (el) {
                    el.classList.remove('open');
                    el.querySelector('.faq-question').setAttribute('aria-expanded', 'false');
                });
                if (!isOpen) { item.classList.add('open'); this.setAttribute('aria-expanded', 'true'); }
            });
        });

        // Keep the resource links visible beside desktop articles and collapsible on mobile.
        var resourceMenu = document.querySelector('.resource-sidebar__menu');
        if (resourceMenu) {
            var resourceDesktop = window.matchMedia('(min-width: 1100px)');
            function syncResourceMenu() { resourceMenu.open = resourceDesktop.matches; }
            syncResourceMenu();
            resourceDesktop.addEventListener('change', syncResourceMenu);
        }

        var isTouchDevice = false;
        window.addEventListener('touchstart', function () { isTouchDevice = true; }, { once: true, passive: true });
        function closeAllDropdowns(except) {
            document.querySelectorAll('.nav-dropdown.open').forEach(function (dd) {
                if (dd !== except) {
                    if (dd.querySelector('.nav-dropdown__menu').contains(document.activeElement)) {
                        dd.querySelector('.nav-dropdown__toggle').focus();
                    }
                    dd.classList.remove('open');
                    dd.querySelector('.nav-dropdown__toggle').setAttribute('aria-expanded', 'false');
                }
            });
        }
        function openDropdown(dd) {
            closeAllDropdowns(dd);
            dd.classList.add('open');
            dd.querySelector('.nav-dropdown__toggle').setAttribute('aria-expanded', 'true');
        }
        document.querySelectorAll('.nav-dropdown').forEach(function (dd) {
            var leaveTimer;
            dd.addEventListener('mouseenter', function () {
                if (isTouchDevice) return;
                clearTimeout(leaveTimer);
                openDropdown(dd);
            });
            dd.addEventListener('mouseleave', function () {
                if (isTouchDevice) return;
                leaveTimer = setTimeout(function () {
                    if (dd.querySelector('.nav-dropdown__menu').contains(document.activeElement)) return;
                    dd.classList.remove('open');
                    dd.querySelector('.nav-dropdown__toggle').setAttribute('aria-expanded', 'false');
                }, 120);
            });
            dd.addEventListener('focusout', function (e) {
                if (!dd.contains(e.relatedTarget) && !dd.matches(':hover')) closeAllDropdowns();
            });
            dd.querySelector('.nav-dropdown__toggle').addEventListener('click', function (e) {
                e.stopPropagation();
                var isOpen = dd.classList.contains('open');
                closeAllDropdowns(dd);
                if (!isOpen) { dd.classList.add('open'); this.setAttribute('aria-expanded', 'true'); }
                else { dd.classList.remove('open'); this.setAttribute('aria-expanded', 'false'); }
            });
        });
        var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        document.documentElement.classList.toggle('is-ios', isIOS);

        // Offer the sticky action on iOS after the hero, except beside another
        // download prompt. Storage denial must not break routing or analytics.
        var cta = document.getElementById('stickyCta');
        var ctaDismissed = false;
        try { ctaDismissed = sessionStorage.getItem('ctaDismissed') === '1'; } catch (e) {}
        if (cta && isIOS && location.pathname !== '/download/' && !ctaDismissed) {
            cta.hidden = false;
            var ctaClose = document.getElementById('stickyCtaClose');
            var mobileCta = window.matchMedia('(max-width: 900px)');
            var visiblePrompts = new Set();
            var ctaTicking = false;
            var pastHero = false;
            var hero = document.querySelector('.hero, .page-hero, #article-heading');
            var observeHero = hero && 'IntersectionObserver' in window;
            function syncCta() {
                ctaTicking = false;
                var past = observeHero ? pastHero : window.scrollY > window.innerHeight * 0.9;
                var visible = mobileCta.matches && past && !visiblePrompts.size && !ctaDismissed;
                cta.classList.toggle('is-visible', visible);
                cta.inert = !visible;
            }
            if ('IntersectionObserver' in window) {
                var promptObserver = new IntersectionObserver(function (entries) {
                    entries.forEach(function (entry) {
                        if (entry.isIntersecting) visiblePrompts.add(entry.target);
                        else visiblePrompts.delete(entry.target);
                    });
                    syncCta();
                });
                document.querySelectorAll('footer, .inline-cta, .cta-banner, .mid-cta').forEach(function (prompt) {
                    promptObserver.observe(prompt);
                });
            }
            if (observeHero) {
                new IntersectionObserver(function (entries) {
                    var entry = entries[0];
                    pastHero = !entry.isIntersecting && entry.boundingClientRect.bottom <= 0;
                    syncCta();
                }).observe(hero);
            } else window.addEventListener('scroll', function () {
                if (!ctaTicking) { ctaTicking = true; window.requestAnimationFrame(syncCta); }
            }, { passive: true });
            mobileCta.addEventListener('change', syncCta);
            if (ctaClose) {
                ctaClose.addEventListener('click', function () {
                    ctaDismissed = true;
                    syncCta();
                    try { sessionStorage.setItem('ctaDismissed', '1'); } catch (e) {}
                    window.setTimeout(function () { cta.hidden = true; }, 300);
                });
            }
            syncCta();
        }

        // Invite engaged desktop readers once a week; mobile keeps its small
        // download bar instead of an intrusive interstitial.
        var downloadPopup = document.getElementById('downloadPopup');
        if (downloadPopup && typeof downloadPopup.showModal === 'function') {
            var popupPreview = new URLSearchParams(location.search).has('preview-popup');
            var popupDesktop = window.matchMedia('(min-width: 901px)');
            var popupReady = popupPreview;
            var popupShown = false;
            var lastPopupView = 0;
            try { lastPopupView = Number(localStorage.getItem('productifyDownloadPopupViewed') || 0); } catch (e) {}
            function popupEvent(name) {
                if (typeof window.gtag === 'function') gtag('event', name, {
                    campaign: 'editorial_download_v1',
                    page_path: location.pathname
                });
            }
            function maybeShowPopup() {
                if (!popupReady || popupShown || document.visibilityState !== 'visible') return;
                if (!popupPreview) {
                    if (!popupDesktop.matches || Date.now() - lastPopupView < 7 * 86400000) return;
                    var scrollable = Math.max(1, document.documentElement.scrollHeight - innerHeight);
                    if (scrollY < 600 || scrollY / scrollable < .25) return;
                    var otherPrompt = document.querySelector('.cta-banner, footer');
                    if (otherPrompt) {
                        var bounds = otherPrompt.getBoundingClientRect();
                        if (bounds.top < innerHeight && bounds.bottom > 0) return;
                    }
                }
                popupShown = true;
                downloadPopup.showModal();
                downloadPopup.querySelector('h2').focus();
                if (!popupPreview) {
                    try { localStorage.setItem('productifyDownloadPopupViewed', String(Date.now())); } catch (e) {}
                }
                popupEvent('download_popup_view');
            }
            downloadPopup.querySelectorAll('[data-popup-close]').forEach(function (button) {
                button.addEventListener('click', function () { downloadPopup.close(); });
            });
            downloadPopup.addEventListener('click', function (event) {
                if (event.target === downloadPopup) downloadPopup.close();
            });
            downloadPopup.addEventListener('close', function () { popupEvent('download_popup_close'); });
            downloadPopup.querySelector('[data-cta="popup"]').addEventListener('click', function () {
                popupEvent('download_popup_click');
            });
            window.addEventListener('scroll', maybeShowPopup, { passive: true });
            document.addEventListener('visibilitychange', maybeShowPopup);
            if (popupPreview) maybeShowPopup();
            else window.setTimeout(function () { popupReady = true; maybeShowPopup(); }, 45000);
        }

        // Contents rail: highlight the section currently being read. Falls back
        // to a plain link list if this never runs.
        var rail = document.querySelector('.toc-rail');
        if (rail) {
            var links = Array.prototype.slice.call(rail.querySelectorAll('a[href^="#"]'));
            var entries = links.map(function (a) {
                return { link: a, target: document.getElementById(decodeURIComponent(a.hash.slice(1))) };
            }).filter(function (e) { return e.target; });

            if (entries.length) {
                var current = null, ticking = false;
                var sync = function () {
                    ticking = false;
                    var best = entries[0];
                    for (var i = 0; i < entries.length; i++) {
                        if (entries[i].target.getBoundingClientRect().top <= 140) best = entries[i];
                    }
                    if (best === current) return;
                    // Read layout before toggling styles to avoid forcing a
                    // synchronous layout calculation on every active change.
                    var lt = best.link.offsetTop, rs = rail.scrollTop, rh = rail.clientHeight;
                    if (current) current.link.classList.remove('is-active');
                    best.link.classList.add('is-active');
                    current = best;
                    // keep the active item in view when the rail itself scrolls
                    if (lt < rs || lt > rs + rh - 40) rail.scrollTop = lt - rh / 2;
                };
                window.addEventListener('scroll', function () {
                    if (!ticking) { ticking = true; window.requestAnimationFrame(sync); }
                }, { passive: true });
                window.addEventListener('resize', sync, { passive: true });
                sync();
            }
        }



        // Keep iOS downloads direct. Other devices use the QR handoff page;
        // source and review links retain their original destination.
        var OUR_APP = 'id1389900237';
        if (!isIOS && location.pathname !== '/download/') {
            document.querySelectorAll('a[href*="apps.apple.com"]').forEach(function (a) {
                if (a.closest('.sticky-cta')) return;
                // Only route download controls, not review/source citations.
                if (!a.matches('.appstore-badge-link, [data-cta]')) return;
                if (a.href.indexOf(OUR_APP) === -1) return;   // competitor listing
                a.dataset.storeHref = a.href;
                a.href = '/download/';
                if (a.hasAttribute('aria-label')) a.setAttribute('aria-label', 'Get Productify for your iPhone');
            });
        }

        /* -- Download CTA tracking ----------------------------------------
           Every App Store link reports WHICH cta produced the click, so a
           change to one placement can be judged on its own. Includes carry an
           explicit data-cta; badges written inline in a page are inferred from
           the block they sit in. Delegated, so CTAs added later are covered
           without touching this. */
        function ctaLocation(a) {
            if (a.dataset.cta) return a.dataset.cta;
            if (a.closest('.sticky-cta'))  return 'sticky';
            if (a.closest('.cta-banner'))  return 'banner';
            if (a.closest('.inline-cta'))  return 'inline';
            if (a.closest('.mobile-nav'))  return 'mobile-nav';
            if (a.closest('footer'))       return 'footer';
            if (a.closest('.navbar, .nav-cta')) return 'nav';
            if (a.closest('.hero'))        return 'hero';
            return 'body';
        }
        document.addEventListener('click', function (e) {
            var a = e.target.closest('a[href*="apps.apple.com"], a[href*="play.google.com"], a[href="/download/"]');
            if (!a || typeof window.gtag !== 'function') return;
            var target = a.href;
            var downloadPage = a.getAttribute('href') === '/download/';
            var ourStore = target.indexOf(OUR_APP) !== -1;
            // Reading an App Store review/source is not a download CTA click.
            if (ourStore && !a.matches('.appstore-badge-link, [data-cta]')) return;
            var evt = downloadPage ? 'download_page_click' :
                      ourStore ? 'download_click' : 'competitor_store_click';
            gtag('event', evt, {
                cta_location: ctaLocation(a),
                page_path: location.pathname,
                link_url: target
            });
        }, true);

        document.querySelectorAll('.nav-dropdown__menu').forEach(function (m) {
            m.addEventListener('click', function (e) { e.stopPropagation(); });
        });
        document.addEventListener('click', function () { closeAllDropdowns(); });
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeAllDropdowns(); });
    })();
</script>
