{%- comment -%}
iOS download bar, shown after the hero and hidden beside another download
prompt. Dismissal lasts for the session. No overlay or installation claim.
{%- endcomment -%}
<div class="sticky-cta" id="stickyCta" hidden inert>
    <span class="sticky-cta__mark" aria-hidden="true">✓</span>
    <div class="sticky-cta__text">
        <strong>Start a habit today</strong>
        <span>5 habits free</span>
    </div>
    <a href="{{ site.appstore_url }}" class="download-button" data-cta="sticky"
       aria-label="Get Productify free on the App Store">
        <svg aria-hidden="true" focusable="false" width="17" height="19" viewBox="15 10 29 32" fill="currentColor">
            <path d="M37.1 26.8c0-3.9 3.2-5.8 3.4-5.9-1.8-2.7-4.7-3-5.7-3.1-2.4-.2-4.8 1.4-6 1.4-1.3 0-3.2-1.4-5.2-1.4-2.7.1-5.2 1.6-6.6 4-2.8 4.9-.7 12.2 2 16.2 1.3 1.9 2.9 4.1 5 4s2.9-1.3 5.5-1.3 3.3 1.3 5.5 1.2c2.2 0 3.5-1.9 4.8-3.9 1.5-2.2 2.1-4.4 2.2-4.5-.1-.1-4.9-1.9-4.9-7.7z"/>
            <path d="M33.2 15.4c1.1-1.4 1.9-3.3 1.7-5.2-1.6.1-3.6 1.1-4.8 2.5-1 1.2-1.9 3.1-1.7 5 1.8.1 3.7-.9 4.8-2.3z"/>
        </svg>
        Start free
    </a>
    <button type="button" class="sticky-cta__close" id="stickyCtaClose" aria-label="Dismiss download banner">✕</button>
</div>
