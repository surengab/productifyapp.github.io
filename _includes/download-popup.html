<dialog class="download-popup" id="downloadPopup" aria-labelledby="download-popup-title" aria-describedby="download-popup-description">
    <div class="download-popup__content">
        <button class="download-popup__close" type="button" aria-label="Close download offer" data-popup-close>×</button>
        <div class="download-popup__copy">
            <span class="download-popup__eyebrow">One small win at a time</span>
            <h2 id="download-popup-title" tabindex="-1">Your next habit starts with one small win.</h2>
            <p id="download-popup-description">Pick one small habit. Check it off today, then make tomorrow easier with Productify.</p>
            <a class="download-popup__store appstore-badge-link" href="{{ site.appstore_url }}" data-cta="popup"
               aria-label="Download Productify on the App Store">
                <img src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg"
                     alt="Download on the App Store" class="appstore-badge" width="180" height="60">
            </a>
            <p class="download-popup__note">5 habits free · No account required · iPhone &amp; Apple Watch</p>
            <button class="download-popup__later" type="button" data-popup-close>Maybe later</button>
        </div>
    </div>
</dialog>
