# Single source of truth for the desktop navbar and the mobile drawer.
# Editable from Pages CMS (Settings -> Navigation).

dropdowns:
  - label: Features
    mobile_label: Features
    items:
      - { href: /features/habit-tracker/,   icon: circle-check, title: "Habit Tracker",     blurb: "Track daily habits with clarity",  mobile: "Habit Tracker" }
      - { href: /features/habit-duo/,       icon: users, title: "Habit Duo",         blurb: "Build one habit with a friend",    mobile: "Habit Duo" }
      - { href: /features/ai-analyser/,     icon: sparkles, title: "AI Habit Analyser", blurb: "Personalized pattern insights",    mobile: "AI Habit Analyser" }
      - { href: /features/habit-templates/, icon: layers, title: "Habit Templates",   blurb: "Start in seconds, not hours",      mobile: "Templates" }
      - { href: /features/measurable-goals/,icon: target, title: "Measurable Goals",  blurb: "Clear targets, less friction" }
      - { href: /features/streak-tracking/, icon: flame, title: "Streak Tracking",   blurb: "Momentum without the guilt",       mobile: "Streak Tracking" }

  - label: Solutions
    items:
      - { href: /solutions/morning-routine/,      icon: sunrise, title: "Build a Morning Routine", blurb: "Start your day with intention",   aria: "Morning Routine guide" }
      - { href: /solutions/evening-routine/,      icon: moon, title: "Build an Evening Routine", blurb: "Wind down and sleep better",     mobile: "Evening Routine" }
      - { href: /solutions/productivity-at-work/, icon: briefcase, title: "Productivity at Work",    blurb: "Habits that improve performance", aria: "Productivity at Work guide" }
      - { href: /solutions/habit-tracker-for-adhd/, icon: puzzle, title: "Habit Tracking with ADHD", blurb: "What helps, what backfires",  mobile: "Habit Tracking with ADHD" }

  - label: Compare
    align: right
    min_width: 240px
    items:
      - { href: /compare/productify-vs-habitify/, icon: scale, title: "Productify vs Habitify", blurb: "Which is better for iPhone?", mobile: "Productify vs Habitify" }
      - { href: /compare/productify-vs-habitica/, icon: gamepad, title: "Productify vs Habitica", blurb: "Minimalist vs gamified RPG",  mobile: "Productify vs Habitica" }
      - { href: /compare/productify-vs-streaks/, icon: watch, title: "Productify vs Streaks", blurb: "Free tier vs one-time purchase", mobile: "Productify vs Streaks" }
      - { href: /compare/productify-vs-loop/, icon: smartphone, title: "Productify vs Loop", blurb: "The iPhone answer for Loop users", mobile: "Productify vs Loop" }
      - { href: /compare/productify-vs-productive/, icon: copy, title: "Productify vs Productive", blurb: "Similar name, different apps", mobile: "Productify vs Productive" }

  - label: Resources
    align: right
    items:
      - { href: /guides/, icon: book-open, title: "Guides", blurb: "Learn to build and track habits", mobile: "Guides" }
      - { href: /blog/, icon: layers, title: "Blog", blurb: "Browse the latest articles", mobile: "Blog" }

  - label: Company
    align: right
    items:
      - { href: /#about, icon: users, title: "About", blurb: "Get to know Productify", mobile: "About" }
      - { href: /#contact, icon: smartphone, title: "Contact", blurb: "Get in touch with the team", mobile: "Contact" }

# Plain links after the dropdowns.
links:
  - { href: /pricing/, label: Pricing }

